{% extends 'base.html' %}

{% block head %}
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
{% endblock %}

{% block content %}

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    const MAPTILER_KEY = 'Mo9jRmaI8uBBDdKKmtvt';

    const TILE_LIGHT = `https://api.maptiler.com/maps/outdoor-v2/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`;
    const TILE_DARK  = `https://api.maptiler.com/maps/dataviz-dark/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`;

    const ATTR = '© <a href="https://www.maptiler.com/copyright/">MapTiler</a> · © <a href="https://www.openstreetmap.org/copyright">OSM</a> contributors';

    const map = L.map('map', { zoomControl: false }).setView([39, -98], 4);
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    const tiles={
        light: L.tileLayer(TILE_LIGHT, {maxZoom: 18, attribution: ATTR}),
        dark: L.tileLayer(TILE_DARK, {maxZoom: 18, attribution: ATTR}),
    };

    const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
    tiles[currentTheme].addTo(map);

    document.getElementById('theme-toggle').addEventListener('click', function(){
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';

        map.removeLayer(tiles[current]);
        tiles[next].addTo(map);
    });

    fetch('api/colleges/')
        .then(res => res.json())
        .then(data => {
            data.forEach(c => {
                const radius = c.student_count > 0 ? Math.max(8, c.student_count * 6) : 6;
                const count = c.student_count === 1 ? '1 student' : '${c.student} students';
                const popup = '<span class="popup-name">${c.name}</span><span class="popup-detail">${c.location} - ${count}</span>';

                L.circleMarker([c.latitude, c.longitude], {
                    radius: radius,
                    fillColor: '#2d4a8a',
                    color: '#2d4a8a',
                    weight: 1.5,
                    fillOpacity: 0.55,
                })
                .addTo(map)
                .bindPopup(popup);
            });
        });
</script>

{% endblock %}
