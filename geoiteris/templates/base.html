<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOITERIS</title>


    <script>
        const t = localStorage.getItem('theme');
        if (t) documentdocumentElement.setAttribute('data-theme', t);
    </script>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {% block head %}
    {% endblock %}
</head>

<body>

    <nav>
        <a href="/" class="brand">GEOITERIS</a>
        <ul>
            <li><a href="/" id="nav-map">MAP</a></li>
            <li><a href="/students" id="nav-students">STUDENTS</a></li>
            <li>
                <button id="theme-toggle" aria-label="Toggle theme">
                    <svg viewBox="0 0 32 32" width="22" height="22" xmlns="http://www.w3.org/2000/svg">
                        <g class="globe-day">
                            <circle cx="16" cy="16" r="15" fill="#4aa8d8"/>
                            <ellipse cx="13" cy="12" rx="5"   ry="4"   fill="#5aaa4a" opacity="0.85"/>
                            <ellipse cx="21" cy="15" rx="4"   ry="5.5" fill="#5aaa4a" opacity="0.8"/>
                            <ellipse cx="9"  cy="20" rx="3.5" ry="3"   fill="#5aaa4a" opacity="0.75"/>
                            <ellipse cx="18" cy="23" rx="3"   ry="2"   fill="#5aaa4a" opacity="0.7"/>
                            <ellipse cx="9"  cy="10" rx="5"   ry="3.5" fill="white"   opacity="0.3"/>
                        </g>
                        <g class="globe-night">
                            <circle cx="16" cy="16" r="15" fill="#0b1030"/>
                            <circle cx="11" cy="13" r="1.2" fill="#ffdb6a" opacity="0.85"/>
                            <circle cx="18" cy="10" r="0.9" fill="#ffdb6a" opacity="0.7"/>
                            <circle cx="22" cy="16" r="1.1" fill="#ffdb6a" opacity="0.8"/>
                            <circle cx="14" cy="21" r="0.9" fill="#ffdb6a" opacity="0.65"/>
                            <circle cx="8"  cy="19" r="0.8" fill="#ffdb6a" opacity="0.7"/>
                            <circle cx="21" cy="22" r="1.0" fill="#ffdb6a" opacity="0.6"/>
                            <circle cx="16" cy="14" r="0.7" fill="#ffdb6a" opacity="0.55"/>
                        </g>
                        <circle cx="16" cy="16" r="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.75"/>
                    </svg>
                </button>
            </li>
        </ul>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <script>
        document.getElementById('theme-toggle').addEventListener('click', function() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        });

        (function() {
            const path = window.location.pathname;
            if (path === '/') document.getElementById('nav-map').classList.add('active');
            else if (path.startsWith('/students')) document.getElementById('nav-students').classList.add('active');
        })();
    </script>

</body>
</html>
